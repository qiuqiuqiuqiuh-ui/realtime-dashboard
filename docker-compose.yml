version: '3.8'

services:
  # =============================================
  # 基础设施
  # =============================================

  mysql:
    image: mysql:8.0
    container_name: dashboard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dashboard
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dashboard-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dashboard-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # =============================================
  # Nacos 注册中心 & 配置中心
  # =============================================

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: dashboard-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =============================================
  # 可观测性
  # =============================================

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: dashboard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.2.0
    container_name: dashboard-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:3
    container_name: dashboard-zipkin
    ports:
      - "9411:9411"

  # =============================================
  # Flink 实时计算
  # =============================================

  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java17
    container_name: dashboard-flink-jobmanager
    command: jobmanager
    ports:
      - "8083:8081"  # Flink Web UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints-dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
    volumes:
      - flink_data:/tmp/flink-checkpoints

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java17
    container_name: dashboard-flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1600m
    depends_on:
      - flink-jobmanager

  # =============================================
  # 应用服务
  # =============================================

  gateway:
    build:
      context: .
      dockerfile: dashboard-gateway/Dockerfile
    container_name: dashboard-gateway
    ports:
      - "8080:8080"
    environment:
      KAFKA_SERVERS: kafka:9092
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  collector:
    build:
      context: .
      dockerfile: dashboard-consumer/Dockerfile
    container_name: dashboard-collector
    ports:
      - "8081:8081"    # Spring HTTP
      - "9090:9090"    # Netty WebSocket
    environment:
      KAFKA_SERVERS: kafka:9092
      REDIS_HOST: redis
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  storage:
    build:
      context: .
      dockerfile: dashboard-storage/Dockerfile
    container_name: dashboard-storage
    ports:
      - "8082:8082"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: dashboard-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./dashboard-front:/usr/share/nginx/html
    depends_on:
      - gateway
      - collector

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  flink_data:
